<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LOONGS platform Admin (PC)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="client">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>client</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f5f6f8;
    }
    #loongs-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #f5f6f8;
      color: #5c6370;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      transition: opacity 0.25s ease;
    }
    #loongs-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loongs-splash .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #d8dde6;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: loongs-spin 0.8s linear infinite;
    }
    @keyframes loongs-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loongs-splash" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <div>加载中…</div>
  </div>
  <!--
    Production: window.__LOONGS_API_BASE_URL__ must be the public HTTPS origin
    (no :22000). Pack dart-define default is https://{host}.
    Local flutter run can omit the script and fall back to dart-define / {host}.
  -->
  <script>window.__LOONGS_API_BASE_URL__='https://lowcode.renloong.com';</script>
  <script>
    (function () {
      var splash = document.getElementById('loongs-splash');
      if (!splash) return;
      var removed = false;
      function hideSplash() {
        if (removed) return;
        removed = true;
        splash.classList.add('is-hidden');
        splash.setAttribute('aria-busy', 'false');
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 280);
      }
      window.addEventListener('flutter-first-frame', hideSplash, { once: true });
      // Fallback if first-frame never fires (broken load).
      setTimeout(hideSplash, 60000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
